[package]
name = "esp32-p4"
version = "0.1.0"
edition = "2021"

[features]
# Experimental rev1.x layout; not a runtime memory-size toggle.
l2-128 = []
# Optional continuous I2S RX capture diagnostics.
audio-lab = []

[dependencies]

[[bin]]
name = "esp32-p4"
harness = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
